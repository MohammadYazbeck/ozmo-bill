services:
  db:
    image: postgres:17-alpine
    container_name: ozmo-bill-db-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ozmo_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ozmo_dev_password}"
      POSTGRES_DB: "${POSTGRES_DB:-ozmo_bill}"
      APP_DB_USER: "${APP_DB_USER:-ozmo_app}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:-ozmo_app_dev_password}"
    volumes:
      - ozmo_bill_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ozmo_bill_postgres_data:
